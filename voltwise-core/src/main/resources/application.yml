server:
  port: 8080

spring:
  application:
    name: voltwise-core
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:voltwise}
    username: ${POSTGRES_USER:voltwise}
    password: ${POSTGRES_PASSWORD:voltwise}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: voltwise-core
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

voltwise:
  seed-demo: ${SEED_DEMO_DATA:true}
  kafka:
    telemetry-topic: ${KAFKA_TELEMETRY_TOPIC:voltwise.telemetry}
    registration-topic: ${KAFKA_REGISTRATION_TOPIC:voltwise.registration}
  ignite:
    host: ${IGNITE_HOST:localhost}
    port: ${IGNITE_PORT:10800}
  tariff:
    warning-threshold: ${QUOTA_WARNING_THRESHOLD:0.8}
    breach-threshold: ${QUOTA_BREACH_THRESHOLD:1.0}
    penalty-multiplier: ${PENALTY_MULTIPLIER:1.5}
    penalty-step: ${PENALTY_STEP:0.2}
    penalty-increment: ${PENALTY_INCREMENT:0.5}
    penalty-max-multiplier: ${PENALTY_MAX_MULTIPLIER:3.0}
    dominant-appliance-threshold: ${DOMINANT_APPLIANCE_THRESHOLD:0.5}
    consecutive-breach-limit: ${CONSECUTIVE_BREACH_LIMIT:3}
  mail:
    from: ${MAIL_FROM:voltwise@example.com}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-1.5-flash}
    base-url: https://generativelanguage.googleapis.com/v1beta

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.voltwise: INFO
    org.apache.ignite: WARN
